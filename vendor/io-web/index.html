  <script data-wp-initial-theme>
(() => {
  let choice;
  try { choice = localStorage.getItem('wp.theme'); } catch {}
  if (choice === 'pink' && false) {
    document.documentElement.dataset.theme = 'pink';
    return;
  }
  if (choice !== 'light' && choice !== 'dark' && choice !== 'auto') choice = "auto";
  document.documentElement.dataset.theme = true &&
    (choice === 'light' || (choice !== 'dark' && choice !== 'light' && matchMedia('(prefers-color-scheme: light)').matches))
    ? 'light' : 'dark';
})();
</script>
<style data-wp-initial-theme>
@layer brand, device;
@layer brand {
  :root {
    --bg: #25282A;
    --bg2: #2D3234;
    --panel: #54585A;
    --panel2: #303638;
    --line: #717C7D;
    --fg: #FFFFFF;
    --muted: #D3DBD8;
    --disabled: #AFBAB6;
    --accent: #A1D6CA;
    --accent2: #BEC6C4;
    --good: #A9DBBE;
    --warn: #F0D299;
    --danger: #FFAFB6;
    --info: #A1D6CA;
    --on-accent: #25282A;
    --scene-petal: #e9aac2;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #FFFFFF;
    --bg2: #F1F3F1;
    --panel: #ECECEB;
    --panel2: #FFFFFF;
    --line: #BEC6C4;
    --fg: #25282A;
    --muted: #525D59;
    --disabled: #75817C;
    --good: #286342;
    --warn: #7E590D;
    --danger: #AC283F;
    --info: #2D6A5D;
    --on-accent: #FFFFFF;
    --scene-petal: #b0446a;
    color-scheme: light;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #FFFFFF;
      --bg2: #F1F3F1;
      --panel: #ECECEB;
      --panel2: #FFFFFF;
      --line: #BEC6C4;
      --fg: #25282A;
      --muted: #525D59;
      --disabled: #75817C;
      --good: #286342;
      --warn: #7E590D;
      --danger: #AC283F;
      --info: #2D6A5D;
      --on-accent: #FFFFFF;
      --scene-petal: #b0446a;
      color-scheme: light;
    }
  }
}

html { background: var(--bg); color: var(--fg); }
</style>
