name: Сборка и релиз

# Запускается по тегу vX.Y.Z: собирает Windows-версию (установщик и портативную),
# экспериментальную Linux-версию (deb, AppImage) и кладёт файлы в Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Собрать интерфейс
        run: python desktop/prepare_webview.py

      - name: Собрать программу
        run: cargo tauri build
        working-directory: desktop

      - name: Сложить артефакты
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item desktop/target/release/iohub-desktop.exe artifacts/
          Copy-Item desktop/target/release/bundle/nsis/*.exe artifacts/
          # версия берётся из Cargo.toml, чтобы имя совпадало и по тегу, и при ручном запуске
          $line = Select-String -Path desktop/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1
          $ver = $line.Matches[0].Groups[1].Value
          Compress-Archive -Path desktop/target/release/iohub-desktop.exe `
            -DestinationPath "artifacts/iohub-desktop-$ver-portable.zip" -Force
          Get-ChildItem artifacts | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ github.ref_name }}
          path: artifacts/*

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Системные пакеты
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target

      - name: Установить tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Собрать интерфейс
        run: python3 desktop/prepare_webview.py

      - name: Собрать программу (экспериментально)
        run: cargo tauri build --bundles deb,appimage
        working-directory: desktop

      - name: Сложить артефакты
        run: |
          mkdir -p artifacts
          cp desktop/target/release/bundle/deb/*.deb artifacts/ || true
          cp desktop/target/release/bundle/appimage/*.AppImage artifacts/ || true
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ github.ref_name }}
          path: artifacts/*

  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Выложить в Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES="Сборка $TAG. Windows: установщик и портативная версия. Пакеты для Linux (deb, AppImage) — экспериментальные, на реальном железе не проверены. Установка и описание: README.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" files/* --clobber
          else
            gh release create "$TAG" files/* --title "iohub-desktop $TAG" --notes "$NOTES"
          fi
