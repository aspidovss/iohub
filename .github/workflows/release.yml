name: Сборка и релиз

# Запускается по тегу с номером интерфейса производителя (v0.8.5.1, см. файл VERSION):
# собирает Windows-версию (установщик и портативную), экспериментальную Linux-версию
# (deb, AppImage) и кладёт файлы в Release. Текст релиза — из CHANGELOG.md, его
# дополняет указание на базу и авторов интерфейса (desktop/tools/release-notes.py).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Собрать интерфейс
        run: python desktop/prepare_webview.py

      - name: Собрать программу
        run: cargo tauri build
        working-directory: desktop

      - name: Сложить артефакты
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          # Номер релиза — из VERSION: он же стоит в теге и показывает программа.
          # Cargo и Tauri понимают только три части, поэтому файл установщика выходит
          # с укороченным именем и получает полное здесь.
          $ver = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$ver") {
            throw "Тег $env:GITHUB_REF_NAME не совпадает с VERSION ($ver)"
          }
          Copy-Item desktop/target/release/bundle/nsis/*.exe `
            "artifacts/iohub-desktop_${ver}_x64-setup.exe"
          Compress-Archive -Path desktop/target/release/iohub-desktop.exe `
            -DestinationPath "artifacts/iohub-desktop-$ver-portable.zip" -Force
          Get-ChildItem artifacts | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ github.ref_name }}
          path: artifacts/*

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Системные пакеты
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 \
            pkg-config libudev-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target

      - name: Установить tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Собрать интерфейс
        run: python3 desktop/prepare_webview.py

      - name: Собрать программу (экспериментально)
        run: cargo tauri build --bundles deb,appimage
        working-directory: desktop

      - name: Сложить артефакты
        run: |
          mkdir -p artifacts
          ver=$(tr -d '[:space:]' < VERSION)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v${ver}" != "${GITHUB_REF_NAME}" ]; then
            echo "Тег ${GITHUB_REF_NAME} не совпадает с VERSION (${ver})" ; exit 1
          fi
          for f in desktop/target/release/bundle/deb/*.deb; do [ -e "$f" ] && cp "$f" "artifacts/iohub-desktop_${ver}_amd64.deb"; done
          for f in desktop/target/release/bundle/appimage/*.AppImage; do [ -e "$f" ] && cp "$f" "artifacts/iohub-desktop-${ver}.AppImage"; done
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ github.ref_name }}
          path: artifacts/*

  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Текст релиза
        env:
          TAG: ${{ github.ref_name }}
        run: python desktop/tools/release-notes.py "$TAG" > notes.md

      - name: Выложить в Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" files/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" files/* --target "$GITHUB_SHA" --title "iohub-desktop $TAG" --notes-file notes.md
          fi
