[package]
name = "iohub-desktop"
version = "0.2.0"
edition = "2021"
description = "Офлайн-программа для клавиатур IO: хост на Tauri с собственным мостом WebHID"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2"

# HID calls block; they run on their own threads, so we only need a channel.
crossbeam-channel = "0.5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
